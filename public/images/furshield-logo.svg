<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3d2e"/>
      <stop offset="100%" stop-color="#051f16"/>
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Shield Backing -->
  <path d="M 256,28 C 385,28 464,104 464,224 C 464,352 360,442 256,484 C 152,442 48,352 48,224 C 48,104 127,28 256,28 Z" 
        fill="url(#shieldGrad)" 
        stroke="#10b981" 
        stroke-width="18" 
        filter="url(#glow)"/>
        
  <!-- Subtle inner ring -->
  <path d="M 256,48 C 368,48 440,116 440,224 C 440,336 348,420 256,460 C 164,420 72,336 72,224 C 72,116 144,48 256,48 Z" 
        fill="none" 
        stroke="rgba(16, 185, 129, 0.25)" 
        stroke-width="4"/>

  <!-- Paw Main Pad -->
  <ellipse cx="256" cy="325" rx="74" ry="58" fill="url(#pawGrad)"/>
  
  <!-- Paw Toes -->
  <circle cx="162" cy="216" r="36" fill="url(#pawGrad)"/>
  <circle cx="226" cy="164" r="36" fill="url(#pawGrad)"/>
  <circle cx="286" cy="164" r="36" fill="url(#pawGrad)"/>
  <circle cx="350" cy="216" r="36" fill="url(#pawGrad)"/>
</svg>